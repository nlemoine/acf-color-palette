name: QA

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Coding standards, PHPStan, Rector and composer test on every supported PHP version.
  qa:
    uses: nlemoine/.github/.github/workflows/php-qa.yml@6f1219ffc35c9f037495cd1e1263c0b278bf8aa6 # main as of 2026-11-26
    permissions:
      contents: read
    with:
      cs-tool: phpcs
      extra-stan-args: --memory-limit=-1
      # The only runtime requirement is PHP, and the Mantle test packages resolve to incompatible lowest versions.
      test-lowest: false
      # Its coverage leg runs the default suites only: the coverage job below runs one process per integration.
      coverage: false

  # ACF PRO fields (repeater rows in WPGraphQL). Skipped without the COMPOSER_AUTH secret, as on pull requests from forks.
  acf-pro:
    name: Tests (ACF PRO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # {"http-basic": {"connect.advancedcustomfields.com": {"username": "<license key>", "password": "<site URL>"}}}
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    steps:
      - name: Skip without ACF PRO credentials
        if: env.COMPOSER_AUTH == ''
        run: echo "::notice::COMPOSER_AUTH is not set, ACF PRO tests are skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.COMPOSER_AUTH != ''
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: env.COMPOSER_AUTH != ''
        with:
          php-version: '8.4'
          coverage: none
      # Not in composer.json: installs without the license must keep working.
      - name: Require ACF PRO
        if: env.COMPOSER_AUTH != ''
        run: composer require --dev --no-update wpengine/advanced-custom-fields-pro:^6
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        if: env.COMPOSER_AUTH != ''
      - if: env.COMPOSER_AUTH != ''
        run: composer test:acf-pro

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # One process per integration, so one report each: Codecov merges them.
      - run: php -d pcov.enabled=1 vendor/bin/phpunit --testsuite unit,core --coverage-clover build/coverage-core.xml
      - run: php -d pcov.enabled=1 vendor/bin/phpunit --testsuite wpgraphql --coverage-clover build/coverage-wpgraphql.xml
        env:
          ACF_COLOR_PALETTE_TEST_INTEGRATION: wpgraphql
      - run: php -d pcov.enabled=1 vendor/bin/phpunit --testsuite admin-columns --coverage-clover build/coverage-admin-columns.xml
        env:
          ACF_COLOR_PALETTE_TEST_INTEGRATION: admin-columns
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage-core.xml,build/coverage-wpgraphql.xml,build/coverage-admin-columns.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
